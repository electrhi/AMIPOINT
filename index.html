<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실적관리</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section id="loginView" class="login-view">
        <div class="login-panel">
          <div class="brand-block">
            <h1>실적관리</h1>
            <p>아이디와 패스워드로 로그인한 뒤 날짜별 수량을 입력합니다.</p>
          </div>

          <form id="loginForm" class="login-form">
            <div class="field">
              <label for="loginId">아이디</label>
              <input id="loginId" type="text" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="loginPassword">패스워드</label>
              <input id="loginPassword" type="password" autocomplete="current-password" required />
            </div>
            <button class="primary" type="submit">로그인</button>
            <p id="loginMessage" class="message"></p>
          </form>
        </div>
      </section>

      <section id="appView" class="app-view" hidden>
        <header class="topbar">
          <div>
            <h1>실적관리</h1>
            <p id="sessionText">로그인됨</p>
          </div>
          <div class="top-actions">
            <div class="connection" id="connectionStatus">Supabase 연결</div>
            <button id="logoutButton">로그아웃</button>
          </div>
        </header>

        <section class="control-band">
          <div class="field">
            <label for="workDate">조회 날짜</label>
            <input id="workDate" type="date" />
          </div>
          <div class="field admin-only">
            <label for="teamCount">조 수량</label>
            <input id="teamCount" type="number" min="1" max="100" value="4" />
          </div>
          <button id="saveSettingsButton" class="admin-only">조 수량 저장</button>
          <button id="reloadButton">조회</button>
        </section>

        <section class="work-area">
          <div class="toolbar">
            <div class="section-heading">
              <h2>일일 수량 입력</h2>
              <p id="summaryText">입력 0개</p>
            </div>
            <div class="button-row">
              <button id="saveRecordsButton" class="primary">저장</button>
              <button id="downloadButton" class="admin-only">엑셀 다운로드</button>
            </div>
          </div>

          <div class="table-wrap">
            <table id="recordsTable">
              <thead>
                <tr>
                  <th rowspan="2">조</th>
                  <th colspan="3">오전</th>
                  <th colspan="3">오후</th>
                  <th rowspan="2">합계</th>
                </tr>
                <tr>
                  <th>합동</th>
                  <th>이전</th>
                  <th>기존</th>
                  <th>합동</th>
                  <th>이전</th>
                  <th>기존</th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
              <tfoot id="recordsFoot"></tfoot>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="quantityCellTemplate">
      <div class="quantity-cell">
        <input type="number" min="0" inputmode="numeric" />
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
